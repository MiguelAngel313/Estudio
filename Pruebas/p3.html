<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: hsla(48, 80%, 58%, 0.659);
        }
        .naranja{
            background: hsl(26, 83%, 59%);
            margin: 100px auto;
            height: 100px;
            width: 100px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5),
             inset -2px -2px 5px hsla(26, 78%, 16%, 0.5);
            border-radius: 10%;
        }
        .azul{
            background: hsl(200, 83%, 59%);
            margin: 100px auto;
            height: 100px;
            width: 100px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5),
             inset -2px -2px 5px hsla(200, 78%, 16%, 0.5);
            border-radius: 10%;
        }
        .verde{
            background: hsl(120, 83%, 59%);
            margin: 100px auto;
            height: 100px;
            width: 100px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.5),
             inset -2px -2px 5px hsla(120, 78%, 16%, 0.5);
            border-radius: 10%;
        }
    </style>
</head>
<body>
    <div class="naranja"></div>
    <div class="azul"></div>
    <div class="verde"></div>
</body>
</html>
