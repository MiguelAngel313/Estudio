<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div > span{
            background: red;
        }
        
        div ~ p{
            background: green;
        }

    </style>
</head>
<body>
    
    <div>
        <span>Prueba1</span>
        <span>Prueba2</span>
    </div>

    <div></div>
    <p>Parrafo1</p>
    <p>Parrafo2</p>

</body>
</html>
